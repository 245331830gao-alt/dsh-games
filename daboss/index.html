    var b = uiButtons();
    if (phase === 'title') { reset(); return; }
    if (phase === 'won' || phase === 'lost') { if (restartGuard <= 0) reset(); return; }
    if (dist(p.x, p.y, b.ult.x, b.ult.y) < b.ult.r) { tryUlt(); return; }
    if (dist(p.x, p.y, b.jump.x, b.jump.y) < b.jump.r) { touch.jump = true; jumpQueued = true; return; }
    if (dist(p.x, p.y, b.attack.x, b.attack.y) < b.attack.r) { touch.attack = true; return; }
    if (p.x < 320) { if (p.x < 140) touch.left = true; else touch.right = true; return; }
    // 画面其他区域：按哪边就往哪边走，点上方跳
    if (p.y < 420) { touch.jump = true; jumpQueued = true; }
    else if (p.x < 640) touch.left = true; else touch.right = true;
  }

  function toWorld(cx, cy) {
    var rect = canvas.getBoundingClientRect();
    return { x: (cx - rect.left) / fit, y: (cy - rect.top) / fit };
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var p = toWorld(e.clientX, e.clientY);
    handlePress(p);
  });
  canvas.addEventListener('pointerup', function (e) { e.preventDefault(); touch.left = touch.right = touch.jump = touch.attack = false; });
  canvas.addEventListener('pointercancel', function () { touch.left = touch.right = touch.jump = touch.attack = false; });
  canvas.addEventListener('pointerleave', function () { touch.left = touch.right = touch.jump = touch.attack = false; });

  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    keys[k] = true;
    if (k === ' ' || k === 'arrowup' || k === 'w') { if (phase !== 'playing') handlePress({ x: 640, y: 300 }); jumpQueued = true; }
    if (k === 'enter') { if (phase !== 'playing') handlePress({ x: 640, y: 300 }); }
    if (k === 'j' || k === 'k') touch.attack = true;
    if (k === 'l') tryUlt();
    if (k === 'm') muted = !muted;
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key.toLowerCase();
    keys[k] = false;
    if (k === 'j' || k === 'k') touch.attack = false;
  });

  /* ---------- 8. 环境查询 ---------- */
  function segAt(x) {
    for (var i = 0; i < SEGS.length; i++) if (x >= SEGS[i][0] && x <= SEGS[i][1]) return SEGS[i];
    return null;
  }
  function platformAt(x, y) {
    for (var i = 0; i < PLATFORMS.length; i++) {
      var p = PLATFORMS[i];
      if (x >= p.x && x <= p.x + p.w && y >= p.y - 6 && y <= p.y + 14) return p;
    }
    return null;
  }
  function groundYAt(x) { return segAt(x) ? GROUND_Y : null; }

  /* ---------- 9. 实体 ---------- */
  function spawnEnemy(type, x) {
    var e = { type: type, x: x, y: GROUND_Y, vx: 0, vy: 0, hp: 1, w: 56, h: 64, dir: -1, t: rand(0, 2), dead: false, hurt: 0, onGround: true };
    if (type === 'paper') { e.hp = 1; e.w = 52; e.h = 58; e.speed = 130; }
    else if (type === 'phone') { e.hp = 2; e.w = 50; e.h = 66; e.speed = 70; e.w = 50; }
    else if (type === 'meeting') { e.hp = 3; e.w = 64; e.h = 72; e.speed = 0; e.shootT = rand(1, 2.4); }
    else if (type === 'kpi') { e.hp = 6; e.w = 70; e.h = 86; e.speed = 95; }
    enemies.push(e);
  }
  function spawnCoin(x, y) { items.push({ type: 'coin', x: x, y: y, vy: rand(-320, -180), vx: rand(-90, 90), age: 0, life: 12 }); }
  function spawnCoffee(x, y) { items.push({ type: 'coffee', x: x, y: y, vy: rand(-300, -160), vx: rand(-80, 80), age: 0, life: 14 }); }

  function addPart(x, y, color, n, sp) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, TAU), s = rand(60, sp || 320);
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.6), age: 0, color: color, r: rand(2, 6) });
    }
  }
  function addFloat(x, y, text, color, size) {
    floats.push({ x: x, y: y, text: text, color: color || '#fff', age: 0, life: 0.85, size: size || 26 });
  }

  /* ---------- 10. 重置 / 结束 ---------- */
  function reset() {
    phase = 'playing';
    hero.x = 80; hero.y = GROUND_Y; hero.vx = 0; hero.vy = 0; hero.onGround = false;
    hero.facing = 1; hero.invuln = 0; hero.attackCd = 0; hero.swing = 0;
    hearts = R.hearts; rage = 0; score = 0; coins = 0; combo = 0; comboT = 0; bestCombo = 0;
    enemies = []; items = []; shots = []; parts = []; floats = [];
    boss = { x: BOSS_X, y: GROUND_Y, hp: R.bossHp, maxHp: R.bossHp, stage: 1, hurt: 0, shield: R.shieldHp, shieldMax: R.shieldHp, atkT: 2.2, state: 'shield', rolling: 0, wob: 0, dead: false, fly: 0 };
    bossActive = false; camLock = false; doorT = 0;
    shake = 0; flash = 0; slow = 0; hurtFlash = 0; elapsed = 0; restartGuard = 0;
    ultActive = 0; ultDone = false; taunt = ''; tauntT = 0;
    stats = { kills: 0, hits: 0 };
    cam.x = 0; curZone = 1; bannerT = 0;
    for (var i = 0; i < SPAWNS.length; i++) spawnEnemy(SPAWNS[i][0], SPAWNS[i][1]);
    say('周一早会，王总让你汇报周报。', 2.2);
    emitPhase();
  }

  function endGame(won) {
    phase = won ? 'won' : 'lost';
    restartGuard = 0.7;
    if (won) sfx.win(); else sfx.lose();
    emitPhase();
  }

  function say(text, sec) { taunt = text; tauntT = sec || 2; }

  /* ---------- 11. 攻击 / 伤害 ---------- */
  function attackBox() {
    var reach = 116;
    return { x1: hero.facing > 0 ? hero.x : hero.x - reach, x2: hero.facing > 0 ? hero.x + reach : hero.x, y1: hero.y - hero.h, y2: hero.y };
  }

  function doSwing() {
    hero.attackCd = 0.3; hero.swing = 0.16;
    sfx.swing();
    var box = attackBox();
    var i, e;
    for (i = enemies.length - 1; i >= 0; i--) {
      e = enemies[i];
      if (e.dead) continue;
      if (e.x + e.w / 2 > box.x1 && e.x - e.w / 2 < box.x2 && e.y - e.h < box.y2 && e.y > box.y1 - 20) {
        damageEnemy(e, R.attackDamage, hero.facing);
      }
    }
    if (boss && !boss.dead && bossActive) {
      if (boss.x - 110 < box.x2 && boss.x + 110 > box.x1) damageBoss(R.attackDamage);
    }
  }

  function damageEnemy(e, dmg, dir) {
    e.hp -= dmg;
    e.hurt = 0.18;
    e.vx = dir * 220;
    rage = Math.min(R.rageMax, rage + 2);
    score += 10;
    stats.hits++;
    combo++; comboT = 1.2; if (combo > bestCombo) bestCombo = combo;
    addFloat(e.x, e.y - e.h - 8, String(dmg), combo >= 5 ? '#ffcf3f' : '#ffffff', combo >= 5 ? 30 : 24);
    addPart(e.x, e.y - e.h / 2, '#ffd166', 4, 220);
    sfx.hit();
    if (e.hp <= 0) {
      e.dead = true;
      stats.kills++;
      score += 50;
      addPart(e.x, e.y - e.h / 2, '#e8e2d4', 14, 420);
      spawnCoin(e.x, e.y - 40);
      if (Math.random() < 0.22) spawnCoffee(e.x + 10, e.y - 50);
      sfx.kill();
    }
  }

  function damageBoss(dmg) {
    if (boss.dead) return;
    if (boss.shield > 0) {
      boss.shield = Math.max(0, boss.shield - 1);
      addFloat(boss.x - 60, boss.y - 240, '盾 ' + boss.shield, '#ffcf3f', 26);
      addPart(boss.x - 70, boss.y - 160, '#ffcf3f', 10, 320);
      sfx.hit();
      if (boss.shield <= 0) {
        boss.state = 'fight'; boss.atkT = 1.2;
        say('我的饼……！', 1.8);
        shake = 0.3;
      }
      return;
    }
    boss.hp = Math.max(0, boss.hp - dmg);
    boss.hurt = 0.16;
    rage = Math.min(R.rageMax, rage + 1.5);
    score += dmg;
    combo++; comboT = 1.2; if (combo > bestCombo) bestCombo = combo;
    stats.hits++;
    addFloat(boss.x + rand(-40, 40), boss.y - 200 + rand(-30, 20), String(dmg), '#ff8a6e', 28);
    addPart(boss.x, boss.y - 130, '#ffd166', 5, 260);
    sfx.hit();
    var ratio = boss.hp / boss.maxHp;
    if (ratio <= 0.66 && boss.stage === 1) { boss.stage = 2; say('年轻人，不要只看钱！', 2.2); shake = 0.35; }
    if (ratio <= 0.33 && boss.stage === 2) { boss.stage = 3; say('明天不加班了，求你了！', 2.4); shake = 0.45; }
    if (boss.hp <= 0) bossDie();
  }

  function bossDie() {
    boss.dead = true;
    boss.fly = 0.01;
    slow = 0.9; flash = 0.5; shake = 0.6;
    score += 500;
    addFloat(boss.x, boss.y - 240, '砰！', '#ffcf3f', 64);
    for (var i = 0; i < 26; i++) spawnCoin(boss.x + rand(-120, 120), boss.y - rand(60, 220));
    sfx.ult();
  }

  function tryUlt() {
    if (phase !== 'playing' || rage < R.rageMax || ultActive > 0) return;
    rage = 0; ultActive = 1.0; ultDone = false;
    slow = 0.7; flash = 0.25;
    sfx.ult();
    say('辞职信！', 1.4);
  }

  function ultBlast() {
    for (var i = enemies.length - 1; i >= 0; i--) if (!enemies[i].dead) damageEnemy(enemies[i], 999, 0);
    if (boss && !boss.dead && bossActive) {
      if (boss.shield > 0) { boss.shield = 0; boss.state = 'fight'; boss.atkT = 1.2; }
      damageBoss(55);
    }
    shots.length = 0;
    flash = 0.55; shake = 0.6;
    addFloat(hero.x, hero.y - 200, '辞职信', '#ffcf3f', 56);
  }

  function hurtHero(fromX, dmg) {
    if (hero.invuln > 0 || phase !== 'playing') return;
    hearts -= (dmg || 1);
    hero.invuln = 1.2;
    hero.vx = (hero.x < fromX ? -1 : 1) * 320;
    hero.vy = -260;
    combo = 0; comboT = 0;
    rage = Math.min(R.rageMax, rage + 8);
    hurtFlash = 0.5; shake = 0.35;
    addPart(hero.x, hero.y - 50, '#ff8a6e', 10, 300);
    sfx.hurt();
    if (hearts <= 0) { hearts = 0; endGame(false); }
  }

  /* ---------- 12. 更新 ---------- */
  function updateHero(dt) {
    var left = touch.left || keys['arrowleft'] || keys['a'] || bot.left;
    var right = touch.right || keys['arrowright'] || keys['d'] || bot.right;
    var attack = touch.attack || keys['j'] || keys['k'] || bot.attack;
    var wantJump = jumpQueued || keys[' '] || keys['arrowup'] || keys['w'] || bot.jump;

    var dir = (right ? 1 : 0) - (left ? 1 : 0);
    var speed = R.heroSpeed * (slowNearPhone() ? 0.6 : 1);
    if (dir !== 0) {
      hero.vx += dir * 2800 * dt;
      hero.vx = clamp(hero.vx, -speed, speed);
      hero.facing = dir;
    } else {
      hero.vx -= hero.vx * Math.min(1, 12 * dt);
      if (Math.abs(hero.vx) < 6) hero.vx = 0;
    }

    if (wantJump && (hero.onGround || hero.coyote > 0)) {
      hero.vy = -R.jumpPower;
      hero.onGround = false;
      hero.coyote = 0;
      sfx.jump();
    }
    jumpQueued = false;

    hero.vy += 2300 * dt;
    hero.vy = Math.min(hero.vy, 1500);
    hero.x += hero.vx * dt;
    hero.y += hero.vy * dt;

    // 地面
    var ground = GROUND_Y;
    var wasAir = !hero.onGround;
    hero.onGround = false;
    if (hero.vy >= 0 && hero.y >= ground && segAt(hero.x)) {
      hero.y = ground; hero.vy = 0; hero.onGround = true; hero.coyote = 0.1;
    }
    // 平台
    if (hero.vy >= 0) {
      var pl = platformAt(hero.x, hero.y);
      if (pl && hero.y <= pl.y + 16) { hero.y = pl.y; hero.vy = 0; hero.onGround = true; hero.coyote = 0.1; }
    }
    if (hero.onGround) hero.coyote = 0.1; else hero.coyote = Math.max(0, (hero.coyote || 0) - dt);
    if (hero.onGround && wasAir) addPart(hero.x, hero.y, '#c9d4df', 4, 120);

    // 坑
    if (hero.y > GROUND_Y + 150) {
      hearts -= 1; hurtFlash = 0.5;
      if (hearts <= 0) { hearts = 0; endGame(false); return; }
      var seg = segAt(hero.x) || nearestSeg(hero.x);
      hero.x = seg[0] + 60; hero.y = GROUND_Y - 120; hero.vy = 0; hero.vx = 0; hero.invuln = 1.4;
      addFloat(hero.x, hero.y - 80, '掉下去了', '#ffb3a7', 24);
      if (hearts <= 0) endGame(false);
    }

    // 边界
    hero.x = clamp(hero.x, 40, camLock ? 6520 : world.w - 40);
    if (camLock && hero.x < 5320) hero.x = 5320;

    // 攻击
    hero.attackCd -= dt;
    if (attack && hero.attackCd <= 0) doSwing();
    if (hero.swing > 0) hero.swing -= dt;

    // 受伤无敌
    if (hero.invuln > 0) hero.invuln -= dt;

    // 段落横幅
    var z = hero.x > ARENA_LEFT ? 3 : (hero.x > 2600 ? 2 : 1);
    if (z !== curZone) {
      curZone = z;
      banner = z === 1 ? '第一段 · 办公室走廊' : (z === 2 ? '第二段 · 会议室' : '第三段 · 老板办公室');
      bannerT = 1.8;
    }

    // 进 Boss 房
    if (!bossActive && hero.x > ARENA_LEFT + 120) {
      bossActive = true; camLock = true; doorT = 0.6;
      say('王总：这个需求很简单吧？', 2.4);
      shake = 0.3;
    }
  }

  function slowNearPhone() {
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (!e.dead && e.type === 'phone' && Math.abs(e.x - hero.x) < 150) return true;
    }
    return false;
  }

  function nearestSeg(x) {
    var best = SEGS[0], bd = 1e9;
    for (var i = 0; i < SEGS.length; i++) {
      var d = Math.min(Math.abs(x - SEGS[i][0]), Math.abs(x - SEGS[i][1]));
      if (d < bd) { bd = d; best = SEGS[i]; }
    }
    return best;
  }

  function updateEnemies(dt) {
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.dead) continue;
      if (e.hurt > 0) e.hurt -= dt;
      e.t += dt;

      if (e.type === 'paper' || e.type === 'phone' || e.type === 'kpi') {
        var toward = hero.x < e.x ? -1 : 1;
        e.dir = toward;
        e.x += toward * (e.speed || 100) * dt;
        // 平台边缘不落下
        if (!segAt(e.x)) { e.x -= toward * 2; }
      } else if (e.type === 'meeting') {
        e.shootT = (e.shootT || 2) - dt;
        if (e.shootT <= 0 && Math.abs(hero.x - e.x) < 620) {
          e.shootT = rand(2.2, 3.0);
          var dx = hero.x - e.x, dy = (hero.y - 40) - (e.y - e.h);
          var d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
          shots.push({ type: 'file', x: e.x, y: e.y - e.h + 10, vx: dx / d * 330, vy: dy / d * 330 - 120, r: 18, life: 4 });
        }
      }

      // 接触伤害
      var dx2 = Math.abs(hero.x - e.x), dy2 = Math.abs(hero.y - e.y);
      if (dx2 < (e.w + hero.w) / 2 - 6 && dy2 < (e.h + hero.h) / 2) {
        // 从上方踩
        if (hero.vy > 120 && hero.y - hero.h / 2 < e.y - e.h * 0.4) {
          hero.vy = -520;
          damageEnemy(e, 2, 0);
        } else {
          hurtHero(e.x, 1);
        }
      }
    }
    enemies = enemies.filter(function (e) { return !e.dead; });
  }

  function updateBoss(dt) {
    if (!boss || !bossActive) return;
    if (tauntT > 0) tauntT -= dt;

    if (boss.fly > 0) {
      boss.fly += dt;
      boss.x += 900 * dt;
      boss.y -= 500 * dt;
      if (boss.fly > 1.4 && phase === 'playing') endGame(true);
      return;
    }
    if (boss.dead) return;

    boss.wob += dt;
    if (boss.hurt > 0) boss.hurt -= dt;

    boss.x = clamp(boss.x, 5400, 6420);

    if (boss.rolling > 0) {
      boss.rolling -= dt;
      if (boss.rolling <= 0) boss.state = 'fight';
      return;
    }

    boss.atkT -= dt;
    if (boss.atkT <= 0) {
      boss.atkT = boss.stage === 1 ? 2.4 : (boss.stage === 2 ? 2.0 : 1.6);
      var roll = Math.random();
      if (boss.state === 'shield') {
        // 盾阶段：扔饼
        lobPie();
      } else if (roll < 0.45) {
        rollPie();
      } else if (roll < 0.8) {
        lobPie();
      } else {
        summinions();
      }
    }

    // 近身碰撞：把玩家推开
    if (Math.abs(hero.x - boss.x) < 110 && Math.abs(hero.y - (boss.y - 40)) < 120) {
      hero.x += (hero.x < boss.x ? -1 : 1) * 160 * dt;
      hurtHero(boss.x, 1);
    }
  }

  function rollPie() {
    shots.push({ type: 'roll', x: boss.x - 90, y: GROUND_Y - 52, vx: -430, vy: 0, r: 54, life: 6 });
    addFloat(boss.x, boss.y - 240, '大饼滚压！', '#ffcf3f', 26);
    boss.rolling = 0.8;
    sfx.swing();
  }
  function lobPie() {
    var dx = hero.x - boss.x, dy = (hero.y - 60) - (boss.y - 200);
    var d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    shots.push({ type: 'pie', x: boss.x, y: boss.y - 220, vx: dx / d * 420, vy: dy / d * 420 - 220, r: 34, life: 4 });
    sfx.swing();
  }
  function summinions() {
    spawnEnemy('paper', boss.x - 220);
    spawnEnemy('paper', boss.x - 320);
    addFloat(boss.x, boss.y - 250, '周末加个班', '#ffcf3f', 24);
  }

  function updateShots(dt) {
    for (var i = shots.length - 1; i >= 0; i--) {
      var s = shots[i];
      s.life -= dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (s.type === 'file' || s.type === 'pie') s.vy += 900 * dt;
      if (s.type === 'roll') s.vy += 900 * dt;

      if (s.life <= 0 || s.x < cam.x - 200 || s.x > cam.x + 1500) { shots.splice(i, 1); continue; }

      if (Math.abs(s.x - hero.x) < s.r + 26 && Math.abs(s.y - (hero.y - 44)) < s.r + 40) {
        hurtHero(s.x, 1);
        if (s.type !== 'roll') { shots.splice(i, 1); continue; }
      }
      // 打碎飞来的饼/文件
      var box = attackBox();
      if (hero.swing > 0 && s.x > box.x1 - s.r && s.x < box.x2 + s.r && s.y > box.y1 && s.y < box.y2) {
        if (s.type !== 'roll') { addPart(s.x, s.y, '#ffd166', 8, 260); shots.splice(i, 1); score += 5; continue; }
      }
    }
  }

  function updateItems(dt) {
    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      it.age += dt;
      it.vy += 1600 * dt;
      it.x += it.vx * dt;
      it.y += it.vy * dt;
      it.vx *= 0.98;
      if (it.y > GROUND_Y - 12) { it.y = GROUND_Y - 12; it.vy = 0; it.vx = 0; }
      if (it.age > it.life) { items.splice(i, 1); continue; }
      if (Math.abs(it.x - hero.x) < 40 && Math.abs(it.y - (hero.y - 40)) < 60) {
        if (it.type === 'coin') { coins++; score += 20; sfx.coin(); }
        else { hearts = Math.min(R.hearts, hearts + 1); addFloat(hero.x, hero.y - 110, '+1 心', '#7ee787', 24); sfx.coin(); }
        items.splice(i, 1);
      }
    }
  }

  function updateFx(dt) {
    var i;
    for (i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 1000 * dt;
      if (p.age >= p.life) parts.splice(i, 1);
    }
    for (i = floats.length - 1; i >= 0; i--) {
      var f = floats[i];
      f.age += dt; f.y -= 60 * dt;
      if (f.age >= f.life) floats.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 1.8);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.4);
    if (hurtFlash > 0) hurtFlash = Math.max(0, hurtFlash - dt * 2);
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
    if (bannerT > 0) bannerT -= dt;
  }

  function update(dt) {
    if (restartGuard > 0) restartGuard -= dt;
    updateFx(dt);
    if (phase !== 'playing') { camUpdate(dt); return; }

    var step = dt;
    if (slow > 0) { slow -= dt; step = dt * 0.35; }

    elapsed += dt;
    updateHero(step);
    updateEnemies(step);
    updateBoss(step);
    updateShots(step);
    updateItems(step);

    if (ultActive > 0) {
      ultActive -= dt;
      if (ultActive <= 0.55 && !ultDone) { ultDone = true; ultBlast(); }
    }

    camUpdate(dt);
  }

  function camUpdate(dt) {
    var target = camLock ? 5320 : clamp(hero.x - 640, 0, world.w - 1280);
    cam.x += (target - cam.x) * Math.min(1, 8 * dt);
    if (cam.x < 0) cam.x = 0;
    if (cam.x > world.w - 1280) cam.x = world.w - 1280;
  }

  /* ---------- 13. 绘制 ---------- */
  function bg() {
    var zone = cam.x > 4200 ? 3 : (cam.x > 2100 ? 2 : 1);
    // 墙面
    ctx.fillStyle = zone === 3 ? '#d5dee8' : (zone === 2 ? '#e6ecf3' : '#dfe7ef');
    ctx.fillRect(0, 0, 1280, 520);

    if (zone === 3) {
      // 老板办公室：落地玻璃 + 城市天际线
      ctx.fillStyle = '#b9d9ef';
      ctx.fillRect(0, 60, 1280, 400);
      ctx.fillStyle = '#9fc4dd';
      var sky = [40, 120, 60, 180, 90, 150, 70];
      for (var b = 0; b < 14; b++) {
        var bx = ((b * 130 - cam.x * 0.4) % 1800 + 1800) % 1800 - 200;
        var h = sky[b % sky.length];
        ctx.fillRect(bx, 460 - h, 96, h);
        ctx.fillStyle = b % 2 ? '#8fb6d2' : '#9fc4dd';
        ctx.fillStyle = '#9fc4dd';
      }
      ctx.strokeStyle = '#8d9aa8';
      ctx.lineWidth = 12;
      for (var w2 = 0; w2 < 1280 + 400; w2 += 320) {
        var wx2 = w2 - (cam.x * 0.5) % 320;
        ctx.beginPath(); ctx.moveTo(wx2, 60); ctx.lineTo(wx2, 470); ctx.stroke();
      }
      ctx.strokeRect(0, 60, 1280, 410);
    } else if (zone === 2) {
      // 会议室：白板 + 投影幕 + 吊灯
      ctx.fillStyle = '#f9fbfd';
      ctx.fillRect(120 - (cam.x * 0.3) % 900, 120, 420, 240);
      ctx.strokeStyle = '#9aa7b4';
      ctx.lineWidth = 8;
      ctx.strokeRect(120 - (cam.x * 0.3) % 900, 120, 420, 240);
      ctx.fillStyle = '#8fa0b3';
      ctx.font = 'bold 26px "PingFang SC", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('Q3 目标：再创新高', 160 - (cam.x * 0.3) % 900, 175);
      ctx.fillStyle = '#b9c6d4';
      ctx.fillRect(160 - (cam.x * 0.3) % 900, 200, 300, 12);
      ctx.fillRect(160 - (cam.x * 0.3) % 900, 230, 220, 12);
      // 吊灯
      for (var lx = 240; lx < 1400; lx += 420) {
        var x3 = lx - (cam.x * 0.6) % 420;
        ctx.strokeStyle = '#8d9aa8'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x3, 0); ctx.lineTo(x3, 70); ctx.stroke();
        ctx.fillStyle = '#f2e3b3';
        ctx.beginPath(); ctx.moveTo(x3 - 40, 70); ctx.lineTo(x3 + 40, 70); ctx.lineTo(x3 + 24, 96); ctx.lineTo(x3 - 24, 96); ctx.closePath(); ctx.fill();
      }
    } else {
      // 走廊：窗 + 门
      for (var wx = 0; wx < world.w; wx += 720) {
        var x = wx - cam.x * 0.35;
        if (x < -300 || x > 1500) continue;
        ctx.fillStyle = '#cfe6f5';
        ctx.strokeStyle = '#9aa7b4';
        ctx.lineWidth = 8;
        ctx.fillRect(x, 90, 260, 210);
        ctx.strokeRect(x, 90, 260, 210);
        ctx.beginPath(); ctx.moveTo(x + 130, 90); ctx.lineTo(x + 130, 300); ctx.moveTo(x, 195); ctx.lineTo(x + 260, 195); ctx.stroke();
        // 门
        ctx.fillStyle = '#c9a87c';
        ctx.strokeStyle = '#8a6a44';
        ctx.lineWidth = 5;
        ctx.fillRect(x + 360, 210, 110, 290);
        ctx.strokeRect(x + 360, 210, 110, 290);
        ctx.fillStyle = '#8a6a44';
        ctx.beginPath(); ctx.arc(x + 452, 360, 6, 0, TAU); ctx.fill();
      }
    }

    // 墙裙
    ctx.fillStyle = zone === 3 ? '#b8c4d2' : '#c3ced9';
    ctx.fillRect(0, 500, 1280, 22);
    // 地板
    ctx.fillStyle = zone === 3 ? '#bcc9d6' : '#c9d4df';
    ctx.fillRect(0, 522, 1280, 200);
    ctx.strokeStyle = 'rgba(120,140,160,0.25)';
    ctx.lineWidth = 4;
    for (var gx = 0; gx < 1280 + 200; gx += 200) {
      var sx = gx - (cam.x % 200);
      ctx.beginPath(); ctx.moveTo(sx, 522); ctx.lineTo(sx - 60, 720); ctx.stroke();
    }
  }

  function drawGround() {
    for (var i = 0; i < SEGS.length; i++) {
      var s = SEGS[i];
      var x1 = s[0] - cam.x, x2 = s[1] - cam.x;
      if (x2 < -60 || x1 > 1340) continue;
      // 地板
      ctx.fillStyle = '#b9c6d4';
      ctx.fillRect(x1, GROUND_Y, x2 - x1, 100);
      ctx.fillStyle = '#a7b6c6';
      ctx.fillRect(x1, GROUND_Y + 12, x2 - x1, 6);
      // 桌子腿/边缘
      ctx.strokeStyle = '#8d9aa8';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(x1, GROUND_Y); ctx.lineTo(x2, GROUND_Y); ctx.stroke();
    }
  }

  function drawPlatforms() {
    for (var i = 0; i < PLATFORMS.length; i++) {
      var p = PLATFORMS[i];
      var x = p.x - cam.x;
      if (x < -260 || x > 1400) continue;
      // 桌面
      ctx.fillStyle = '#c58d5a';
      ctx.strokeStyle = '#7a4b2a';
      ctx.lineWidth = 5;
      ctx.fillRect(x, p.y, p.w, 18);
      ctx.strokeRect(x, p.y, p.w, 18);
      // 桌腿
      ctx.fillStyle = '#a87447';
      ctx.fillRect(x + 12, p.y + 18, 12, GROUND_Y - p.y - 18);
      ctx.fillRect(x + p.w - 24, p.y + 18, 12, GROUND_Y - p.y - 18);
      // 桌上文件
      ctx.fillStyle = '#f2f5f8';
      ctx.fillRect(x + p.w * 0.55, p.y - 12, 30, 12);
      ctx.fillStyle = '#e8c34a';
      ctx.fillRect(x + p.w * 0.2, p.y - 10, 18, 10);
    }
  }

  function drawHero() {
    var x = hero.x - cam.x;
    var blink = hero.invuln > 0 && Math.floor(hero.invuln * 12) % 2 === 0;
    // 影子
    ctx.save(); ctx.globalAlpha = 0.16; ctx.fillStyle = '#0b1a2a';
    ctx.beginPath(); ctx.ellipse(x, GROUND_Y, 34, 9, 0, 0, TAU); ctx.fill(); ctx.restore();

    ctx.save();
    ctx.translate(x, hero.y - hero.h / 2);
    if (blink) ctx.globalAlpha = 0.45;
    if (hero.facing < 0) ctx.scale(-1, 1);
    // 摆动
    var bob = hero.onGround ? Math.sin(elapsed * 14) * (Math.abs(hero.vx) > 20 ? 2 : 0) : 0;
    ctx.translate(0, bob);
    sprite('hero', 0, 0, 132);
    ctx.restore();

    // 键盘挥击
    if (hero.swing > 0) {
      ctx.save();
      ctx.translate(x + hero.facing * 26, hero.y - 64);
      ctx.rotate(hero.facing * (-0.25 + (1 - hero.swing / 0.16) * 0.85));
      ctx.fillStyle = '#3b3f46';
      ctx.strokeStyle = '#1c1f24';
      ctx.lineWidth = 3;
      ctx.fillRect(-4, -22, 34, 14);
      ctx.strokeRect(-4, -22, 34, 14);
      ctx.fillStyle = '#f2c14e';
      ctx.fillRect(-2, -19, 5, 9);
      ctx.restore();
      // 击打弧
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = '#ffcf3f';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(x + hero.facing * 40, hero.y - 50, 46, -0.9, 0.9);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawEnemy(e) {
    var x = e.x - cam.x;
    if (x < -120 || x > 1400) return;
    ctx.save();
    ctx.translate(x, e.y);
    if (e.hurt > 0) ctx.translate(rand(-3, 3), 0);
    if (e.type === 'paper') {
      ctx.fillStyle = '#f4f1e6';
      ctx.strokeStyle = '#2b1b12';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-24, -12); ctx.lineTo(-8, -52); ctx.lineTo(18, -40); ctx.lineTo(26, -6); ctx.lineTo(4, 4);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2b1b12';
      ctx.beginPath(); ctx.arc(-8, -32, 3.5, 0, TAU); ctx.arc(6, -28, 3.5, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#c94f4f'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-10, -16); ctx.lineTo(10, -10); ctx.stroke();
    } else if (e.type === 'phone') {
      ctx.fillStyle = '#3c4048';
      ctx.strokeStyle = '#1c1f24';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-22, -58, 44, 58, 8) : ctx.rect(-22, -58, 44, 58);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8ad0ff';
      ctx.fillRect(-14, -50, 28, 26);
      ctx.fillStyle = '#ffcf3f';
      ctx.beginPath(); ctx.arc(0, -10, 5, 0, TAU); ctx.fill();
      // 响铃
      ctx.strokeStyle = '#ffcf3f';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, -30, 34, -0.6, 0.6); ctx.stroke();
    } else if (e.type === 'meeting') {
      ctx.fillStyle = '#7f8c9b';
      ctx.strokeStyle = '#1c1f24';
      ctx.lineWidth = 5;
      ctx.fillRect(-30, -70, 60, 58);
      ctx.strokeRect(-30, -70, 60, 58);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-22, -62, 44, 20);
      ctx.fillStyle = '#2b1b12';
      ctx.beginPath(); ctx.arc(-10, -40, 4, 0, TAU); ctx.arc(10, -40, 4, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#2b1b12'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-12, -30); ctx.lineTo(12, -30); ctx.stroke();
    } else {
      // KPI 怪
      ctx.fillStyle = '#e0e6ee';
      ctx.strokeStyle = '#1c1f24';
      ctx.lineWidth = 5;
      ctx.fillRect(-34, -86, 68, 86);
      ctx.strokeRect(-34, -86, 68, 86);
      ctx.strokeStyle = '#c94f4f';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(-22, -66); ctx.lineTo(-6, -56); ctx.lineTo(8, -44); ctx.lineTo(22, -22);
      ctx.stroke();
      ctx.fillStyle = '#2b1b12';
      ctx.beginPath(); ctx.arc(-12, -74, 4, 0, TAU); ctx.arc(12, -74, 4, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawBoss() {
    if (!boss) return;
    var x = boss.x - cam.x;
    if (x < -400 || x > 1700) return;
    var wob = 1 + Math.sin(boss.wob * 3) * 0.015;
    ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = '#0b1a2a';
    ctx.beginPath(); ctx.ellipse(x, GROUND_Y, 90, 16, 0, 0, TAU); ctx.fill(); ctx.restore();

    ctx.save();
    ctx.translate(x, boss.y - 10);
    ctx.scale(wob, 2 - wob);
    if (boss.hurt > 0) ctx.translate(rand(-5, 5), 0);
    sprite('enemy', 0, -150, 320);
    ctx.restore();

    // 大饼盾
    if (boss.shield > 0 && !boss.dead) {
      for (var i = 0; i < boss.shield; i++) {
        ctx.save();
        ctx.translate(x - 110 + i * 34, boss.y - 130 + Math.sin(boss.wob * 2 + i) * 6);
        ctx.fillStyle = '#f6b93b';
        ctx.strokeStyle = '#7a4b0e';
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffd166';
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }

    // 崩坏：假发飞起
    if (boss.stage >= 3 && !boss.dead) {
      ctx.save();
      ctx.translate(x + 26, boss.y - 252 + Math.sin(boss.wob * 4) * 6);
      ctx.rotate(0.6);
      ctx.fillStyle = '#3b2c22';
      ctx.beginPath(); ctx.ellipse(0, 0, 40, 18, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }

    // 台词
    if (taunt && tauntT > 0 && phase === 'playing') {
      ctx.save();
      ctx.font = 'bold 22px "PingFang SC", "Heiti SC", sans-serif';
      var w = Math.min(520, ctx.measureText(taunt).width + 44);
      var bx = clamp(x, 280, 1000), by = boss.y - 330;
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#2b1b12';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx - w / 2, by - 36, w, 56, 16) : ctx.rect(bx - w / 2, by - 36, w, 56);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2b1b12';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(taunt, bx, by - 8);
      ctx.restore();
    }
  }

  function drawShots() {
    for (var i = 0; i < shots.length; i++) {
      var s = shots[i];
      var x = s.x - cam.x;
      ctx.save();
      ctx.translate(x, s.y);
      if (s.type === 'roll') {
        ctx.rotate(-(s.x) / 40);
        sprite('pickup', 0, 0, 110);
      } else if (s.type === 'pie') {
        ctx.rotate(s.x / 30);
        sprite('pickup', 0, 0, 70);
      } else {
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#5b6b7c';
        ctx.lineWidth = 3;
        ctx.fillRect(-14, -18, 28, 36);
        ctx.strokeRect(-14, -18, 28, 36);
        ctx.strokeStyle = '#ff3b1f'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-7, -18); ctx.lineTo(7, 18); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawItems() {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var x = it.x - cam.x;
      if (x < -60 || x > 1340) continue;
      ctx.save();
      ctx.translate(x, it.y);
      if (it.type === 'coin') {
        sprite('pickup', 0, 0, 40);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#7a4b2a';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-14, -16, 28, 30, 4) : ctx.rect(-14, -16, 28, 30);
        ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#7a4b2a';
        ctx.beginPath(); ctx.arc(18, -4, 7, -1.2, 1.2); ctx.stroke();
        ctx.fillStyle = '#8a5a37';
        ctx.fillRect(-12, -8, 24, 12);
      }
      ctx.restore();
    }
  }

  function drawFx() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.globalAlpha = clamp(1 - p.age / p.life, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x - cam.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (var j = 0; j < floats.length; j++) {
      var f = floats[j];
      ctx.save();
      ctx.globalAlpha = clamp(1 - f.age / f.life, 0, 1);
      ctx.font = 'bold ' + f.size + 'px "PingFang SC", "Heiti SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(43,27,18,0.6)';
      ctx.strokeText(f.text, f.x - cam.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x - cam.x, f.y);
      ctx.restore();
    }
  }

  function drawHUD() {
    // 心
    for (var i = 0; i < R.hearts; i++) drawHeart(46 + i * 40, 44, 14, i < hearts);
    // 分数 / 金币
    ctx.font = 'bold 22px "PingFang SC", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#2b1b12';
    ctx.fillText('金币 ' + coins, 46, 96);
    ctx.textAlign = 'right';
    ctx.fillText('得分 ' + score, 1234, 96);

    // 怒气
    var rx = 46, ry = 120, rw = 260, rhh = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(rx, ry, rw, rhh);
    ctx.fillStyle = rage >= R.rageMax ? '#ff3b1f' : '#ffb703';
    ctx.fillRect(rx, ry, rw * (rage / R.rageMax), rhh);
    ctx.strokeStyle = 'rgba(43,27,18,0.5)';
    ctx.lineWidth = 3;
    ctx.strokeRect(rx, ry, rw, rhh);
    ctx.fillStyle = '#2b1b12';
    ctx.font = 'bold 16px "PingFang SC", sans-serif';
    ctx.fillText('怒气', rx + rw + 10, ry + 15);

    // 连击
    if (combo >= 3) {
      ctx.textAlign = 'center';
      ctx.fillStyle = combo >= 8 ? '#ff3b1f' : '#c94f4f';
      ctx.font = 'bold ' + (26 + Math.min(18, combo)) + 'px "PingFang SC", sans-serif';
      ctx.fillText(combo + ' 连击', 640, 120);
    }

    // Boss 血条
    if (bossActive && boss && !boss.dead) {
      var bw = 620, bx = 330, by = 30;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillRect(bx, by, bw, 22);
      ctx.fillStyle = '#e94f37';
      ctx.fillRect(bx + 3, by + 3, (bw - 6) * clamp(boss.hp / boss.maxHp, 0, 1), 16);
      ctx.strokeStyle = '#2b1b12'; ctx.lineWidth = 4;
      ctx.strokeRect(bx, by, bw, 22);
      ctx.fillStyle = '#2b1b12';
      ctx.font = 'bold 20px "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('画饼王 ' + Math.ceil(boss.hp) + ' / ' + boss.maxHp, 640, 24);
    }

    // 段落横幅
    if (bannerT > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, bannerT);
      ctx.textAlign = 'center';
      ctx.font = 'bold 40px "PingFang SC", sans-serif';
      ctx.lineWidth = 8;
      ctx.strokeStyle = 'rgba(43,27,18,0.6)';
      ctx.strokeText(banner, 640, 210);
      ctx.fillStyle = '#ffd166';
      ctx.fillText(banner, 640, 210);
      ctx.restore();
    }

    // 触屏按钮
    var b = uiButtons();
    drawBtn(b.left.x, b.left.y, b.left.r, '◀', touch.left);
    drawBtn(b.right.x, b.right.y, b.right.r, '▶', touch.right);
    drawBtn(b.jump.x, b.jump.y, b.jump.r, '跳', touch.jump);
    drawBtn(b.attack.x, b.attack.y, b.attack.r, '打', touch.attack);
    ctx.save();
    ctx.globalAlpha = rage >= R.rageMax ? 1 : 0.35;
    drawBtn(b.ult.x, b.ult.y, b.ult.r, '辞', rage >= R.rageMax, '#ff3b1f');
    ctx.restore();
  }

  function drawBtn(x, y, r, label, active, color) {
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
    ctx.fillStyle = active ? (color || '#ffb703') : 'rgba(255,255,255,0.28)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(43,27,18,0.55)';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = '#2b1b12';
    ctx.font = 'bold 26px "PingFang SC", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x, y);
    ctx.restore();
  }

  function drawHeart(x, y, r, full) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, r * 0.4);
    ctx.bezierCurveTo(-r, -r * 0.55, -r * 0.45, -r * 1.15, 0, -r * 0.42);
    ctx.bezierCurveTo(r * 0.45, -r * 1.15, r, -r * 0.55, 0, r * 0.4);
    ctx.closePath();
    ctx.fillStyle = full ? '#e94f37' : 'rgba(120,130,140,0.4)';
    ctx.fill();
    ctx.strokeStyle = '#2b1b12'; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }

  function drawOverlay() {
    if (phase === 'playing') return;
    ctx.save();
    ctx.fillStyle = 'rgba(13,17,23,0.75)';
    ctx.fillRect(0, 0, 1280, 720);
    ctx.textAlign = 'center';
    if (phase === 'title') {
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 96px "PingFang SC", "Heiti SC", sans-serif';
      ctx.fillText(TITLE, 640, 250);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 30px "PingFang SC", sans-serif';
      ctx.fillText('横版闯关 · 一关三段：走廊 → 会议室 → 老板办公室', 640, 320);
      ctx.font = '24px "PingFang SC", sans-serif';
      ctx.fillStyle = '#c8d3df';
      ctx.fillText('← → 跑    跳    打（按住连击）    怒气满放「辞职信」', 640, 400);
      ctx.fillText('踩小怪能弹起来，掉坑里会掉一颗心', 640, 440);
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 36px "PingFang SC", sans-serif';
      ctx.fillText('点屏幕开始', 640, 560);
    } else if (phase === 'won') {
      var rate = Math.round(clamp(60 + stats.kills * 2 + coins * 1.5 + bestCombo * 1.2 + hearts * 5, 60, 99));
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 72px "PingFang SC", sans-serif';
      ctx.fillText('王总被打服了', 640, 240);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 40px "PingFang SC", sans-serif';
      ctx.fillText('今日份解压值 +' + rate, 640, 330);
      ctx.font = '28px "PingFang SC", sans-serif';
      ctx.fillStyle = '#c8d3df';
      ctx.fillText('击败小怪 ' + stats.kills + ' · 金币 ' + coins + ' · 最高连击 ' + bestCombo, 640, 390);
      ctx.fillText('王总：明天不加班了，求你了', 640, 440);
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 34px "PingFang SC", sans-serif';
      ctx.fillText('点屏幕再来一局', 640, 540);
    } else {
      ctx.fillStyle = '#ff8a6e';
      ctx.font = 'bold 72px "PingFang SC", sans-serif';
      ctx.fillText('你被优化了', 640, 240);
      ctx.fillStyle = '#c8d3df';
      ctx.font = '30px "PingFang SC", sans-serif';
      ctx.fillText('简历投出去 30 份，明天继续', 640, 330);
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 34px "PingFang SC", sans-serif';
      ctx.fillText('点屏幕再战', 640, 440);
    }
    ctx.restore();
  }

  function render() {
    var shX = shake > 0 ? rand(-1, 1) * shake * 16 : 0;
    var shY = shake > 0 ? rand(-1, 1) * shake * 16 : 0;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * fit, 0, 0, dpr * fit, dpr * ox + shX, dpr * oy + shY);

    bg();
    drawGround();
    drawPlatforms();
    drawItems();
    var i;
    for (i = 0; i < enemies.length; i++) drawEnemy(enemies[i]);
    drawBoss();
    drawShots();
    drawHero();
    drawFx();

    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flash + ')'; ctx.fillRect(0, 0, 1280, 720); }
    if (hurtFlash > 0) {
      var g = ctx.createRadialGradient(640, 360, 260, 640, 360, 760);
      g.addColorStop(0, 'rgba(255,0,0,0)');
      g.addColorStop(1, 'rgba(255,40,40,' + (hurtFlash * 0.6) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 1280, 720);
    }
    drawHUD();
    drawOverlay();
    if (window.innerHeight > window.innerWidth) drawRotateHint();
  }

  function drawRotateHint() {
    ctx.save();
    ctx.fillStyle = 'rgba(13,17,23,0.82)';
    ctx.fillRect(0, 0, 1280, 720);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 46px "PingFang SC", sans-serif';
    ctx.fillText('请把手机横过来', 640, 330);
    ctx.fillStyle = '#c8d3df';
    ctx.font = '26px "PingFang SC", sans-serif';
    ctx.fillText('横屏玩起来才够宽，走廊才跑得开', 640, 380);
    ctx.font = '54px "PingFang SC", sans-serif';
    ctx.fillText('⟳', 640, 460);
    ctx.restore();
  }

  /* ---------- 14. 尺寸 ---------- */
  function resize() {
    var cssW = window.innerWidth || 1280;
    var cssH = window.innerHeight || 720;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    fit = Math.min(cssW / 1280, cssH / 720);
    ox = (cssW - 1280 * fit) / 2;
    oy = (cssH - 720 * fit) / 2;
  }
  window.addEventListener('resize', resize);

  /* ---------- 15. 契约 ---------- */
  window.__gameState = function () {
    function rd(v) { return typeof v === 'number' && isFinite(v) ? Math.round(v * 100) / 100 : 0; }
    return {
      phase: phase,
      time: rd(elapsed),
      score: rd(score),
      hearts: hearts,
      hero: { x: rd(hero.x), y: rd(hero.y) },
      enemies: enemies.map(function (e) { return { x: rd(e.x), y: rd(e.y) }; }),
      pickups: items.map(function (it) { return { x: rd(it.x), y: rd(it.y) }; }),
      world: { w: 1280, h: 720 },
      boss: boss ? { hp: rd(boss.hp), shield: boss.shield, stage: boss.stage } : null,
      fps: rd(fps)
    };
  };

  window.__renderSlots = function () {
    var out = {};
    ['hero', 'enemy', 'pickup'].forEach(function (key) {
      var c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      var g = c.getContext('2d');
      g.translate(128, 128);
      var img = images[key];
      if (img) {
        var iw = img.naturalWidth || 256, ih = img.naturalHeight || 256;
        var sc = Math.min(225 / iw, 225 / ih);
        g.drawImage(img, -iw * sc / 2, -ih * sc / 2, iw * sc, ih * sc);
      }
      out[key] = c.toDataURL('image/png');
    });
    return out;
  };

  var rendered = false;
  function imageSettled() {
    if (rendered) return;
    for (var k in loading) if (loading[k]) return;
    rendered = true;
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dsh-game-studio', type: 'renders', renders: window.__renderSlots() }, '*');
      }
    } catch (e) { /* ignore */ }
  }

  /* 自动试玩（给 playtest 用） */
  var autoT = 0;
  window.__autoplay = function (state) {
    if (phase !== 'playing' || !state) return;
    autoT += 0.1;
    bot.left = false; bot.right = true; bot.jump = false; bot.attack = false;
    if (bossActive) {
      var dx = (boss.x || 6120) - hero.x;
      bot.right = dx > 120; bot.left = dx < -120;
      bot.attack = Math.abs(dx) < 150;
      // 躲滚饼
      for (var i = 0; i < shots.length; i++) {
        var s = shots[i];
        if (s.type === 'roll' && s.x - hero.x > -20 && s.x - hero.x < 260) bot.jump = true;
      }
      if (hero.y > GROUND_Y - 100 && Math.random() < 0.3) bot.jump = true;
    } else {
      // 前方有坑就跳
      if (!segAt(hero.x + 90) && hero.onGround) bot.jump = true;
      // 前方有怪就打/跳
      for (var j = 0; j < enemies.length; j++) {
        var e = enemies[j];
        var d = e.x - hero.x;
        if (d > -40 && d < 120) { bot.attack = true; if (e.type === 'kpi' && Math.random() < 0.2) bot.jump = true; }
      }
    }
    if (rage >= R.rageMax && Math.random() < 0.3) tryUlt();
  };

  /* ---------- 16. 主循环 ---------- */
  var last = 0, fps = 60, acc = 0, cnt = 0;
  function loop(ts) {
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    if (dt > 0) { acc += 1 / dt; cnt++; if (cnt >= 20) { fps = acc / cnt; acc = 0; cnt = 0; } }
    update(dt);
    render();
    imageSettled();
    requestAnimationFrame(loop);
  }

  function emitPhase() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dsh-game-studio', type: 'phase', phase: phase, score: score }, '*');
      }
    } catch (e) { /* ignore */ }
  }

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body></html>
